services:
  # Render Web Service for FastAPI Backend & WebSockets
  - type: web
    name: polartwin-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: polartwin-render-db   # Render-managed PostgreSQL (not Supabase)
          property: connectionString
      - key: JWT_SECRET
        generateValue: true           # Render auto-generates a cryptographically random secret
      - key: SIMULATION_TICK_SECONDS
        value: 4
      - key: FRONTEND_ORIGIN
        value: "https://polartwin.pages.dev"
      - key: CORS_ORIGINS
        value: '["https://polartwin.pages.dev","http://localhost:5173"]'

databases:
  # Render-managed PostgreSQL (renamed from polartwin-supabase-db — it is NOT Supabase)
  - name: polartwin-render-db
    plan: standard
