services:
  # Render Web Service for FastAPI Backend & WebSockets
  - type: web
    name: polartwin-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: polartwin-supabase-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATION_TICK_SECONDS
        value: 4
      - key: CORS_ORIGINS
        value: '["https://polartwin.pages.dev","https://polartwin.vercel.app","http://localhost:5173"]'

databases:
  - name: polartwin-supabase-db
    plan: standard
