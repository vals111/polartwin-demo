version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polartwin-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./polartwin.db
      # JWT_SECRET must be set via host env or a .env file — NEVER hardcode here.
      # Generate: python -c "import secrets; print(secrets.token_hex(48))"
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in environment or .env}
      - SIMULATION_TICK_SECONDS=4
    volumes:
      - polartwin-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polartwin-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  polartwin-data:
